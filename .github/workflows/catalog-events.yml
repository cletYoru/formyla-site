name: Telegram bot and catalog events

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "inventory.json"
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose poll to process Telegram messages or event to process a sale/restock"
        required: true
        type: choice
        default: poll
        options:
          - poll
          - event
      event_type:
        description: "sale or restock (only for event mode)"
        required: false
        type: choice
        options:
          - sale
          - restock
      event_id:
        description: "Unique event ID (only for event mode)"
        required: false
        type: string
      product_id:
        description: "Product ID from products.json (only for event mode)"
        required: false
        type: string
      product_name:
        description: "Product display name (only for event mode)"
        required: false
        type: string
      variant:
        description: "Exact flavor / product item (only for event mode)"
        required: false
        type: string
      category:
        description: "Product category (only for event mode)"
        required: false
        type: choice
        options:
          - liquids
          - pods
          - vaporizers
      quantity:
        description: "Units sold or restocked (only for event mode)"
        required: false
        default: "1"
        type: string

permissions:
  contents: write

concurrency:
  group: telegram-bot-state
  cancel-in-progress: false

jobs:
  telegram:
    # The workflow commits its encrypted state/inventory. Ignore those bot-authored pushes
    # so they cannot recursively trigger another sync run.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check required secrets
        id: guard
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          STATE_KEY: ${{ secrets.BOT_STATE_KEY }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$STATE_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Add TELEGRAM_BOT_TOKEN and BOT_STATE_KEY to repository Actions secrets to enable the bot." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run bot
        if: steps.guard.outputs.enabled == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_STATE_KEY: ${{ secrets.BOT_STATE_KEY }}
          BOT_MODE: ${{ github.event_name == 'schedule' && 'poll' || (github.event_name == 'push' && 'sync' || (inputs.mode == 'poll' && 'poll' || 'event')) }}
          EVENT_TYPE: ${{ inputs.event_type }}
          EVENT_ID: ${{ inputs.event_id }}
          PRODUCT_ID: ${{ inputs.product_id }}
          PRODUCT_NAME: ${{ inputs.product_name }}
          VARIANT: ${{ inputs.variant }}
          CATEGORY: ${{ inputs.category }}
          QUANTITY: ${{ inputs.quantity }}
          BASE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          SITE_URL: "https://cletyoru.github.io/formyla-site/#buy"
        run: node scripts/telegram-bot.mjs
      - name: Persist encrypted bot state and inventory
        if: steps.guard.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .bot/state.enc inventory.json
          if ! git diff --cached --quiet; then
            git commit -m "Update encrypted Telegram state and inventory"
            # Another workflow or the admin dashboard may update main while the bot runs.
            # Rebase our commit on the latest remote before pushing to avoid non-fast-forward failures.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
