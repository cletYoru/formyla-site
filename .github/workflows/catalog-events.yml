name: Telegram bot and catalog events

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      event_type:
        description: "sale or restock"
        required: true
        type: choice
        options:
          - sale
          - restock
      event_id:
        description: "Unique event ID (used to prevent duplicate processing)"
        required: true
        type: string
      product_id:
        description: "Product ID from products.json"
        required: true
        type: string
      product_name:
        description: "Product display name (validated against catalog)"
        required: true
        type: string
      variant:
        description: "Exact flavor / product item"
        required: true
        type: string
      category:
        description: "Product category"
        required: true
        type: choice
        options:
          - liquids
          - pods
          - vaporizers
      quantity:
        description: "Units sold or restocked"
        required: true
        default: "1"
        type: string

permissions:
  contents: write

concurrency:
  group: telegram-bot-state
  cancel-in-progress: false

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_STATE_KEY: ${{ secrets.BOT_STATE_KEY }}
          BOT_MODE: ${{ github.event_name == 'schedule' && 'poll' || 'event' }}
          EVENT_TYPE: ${{ inputs.event_type }}
          EVENT_ID: ${{ inputs.event_id }}
          PRODUCT_ID: ${{ inputs.product_id }}
          PRODUCT_NAME: ${{ inputs.product_name }}
          VARIANT: ${{ inputs.variant }}
          CATEGORY: ${{ inputs.category }}
          QUANTITY: ${{ inputs.quantity }}
          SITE_URL: "https://cletyoru.github.io/formyla-site/#buy"
        run: node scripts/telegram-bot.mjs
      - name: Persist encrypted bot state and inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .bot/state.enc inventory.json
          if ! git diff --cached --quiet; then
            git commit -m "Update encrypted Telegram state and inventory"
            git push
          fi
